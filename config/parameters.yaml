# Smart Pilot 參數配置檔
# 投資組合再平衡系統設定

# =============================================================================
# PID 控制器參數
# =============================================================================
pid:
  # 比例增益 (Proportional gain)
  # 較大值: 響應更快但可能過度調整
  # 建議範圍: 0.1 ~ 1.0
  kp: 0.5

  # 積分增益 (Integral gain)
  # 用於消除穩態誤差
  # 建議範圍: 0.01 ~ 0.5
  ki: 0.1

  # 微分增益 (Derivative gain)
  # 用於抑制誤差變化，增加穩定性
  # 建議範圍: 0.01 ~ 0.2
  kd: 0.05

# =============================================================================
# 投資組合設定
# =============================================================================
portfolio:
  # 初始資金 (TWD)
  initial_capital: 1000000

  # 預設資產配置
  default_allocation:
    stocks: 0.6      # 股票 60%
    bonds: 0.3       # 債券 30%
    cash: 0.1        # 現金 10%

  # 再平衡閾值
  # 當權重偏離超過此值時觸發再平衡
  rebalance_threshold: 0.05  # 5%

  # 最小交易金額
  min_trade_amount: 1000

# =============================================================================
# 回測設定
# =============================================================================
backtest:
  # 預設回測期間
  default_period: "5y"

  # 交易成本
  transaction_cost: 0.001  # 0.1%

  # 滑價估計
  slippage: 0.0005  # 0.05%

  # 再平衡頻率
  # 可選: daily, weekly, monthly, quarterly, yearly
  rebalance_frequency: "monthly"

# =============================================================================
# 驗證設定
# =============================================================================
validation:
  # 樣本外測試比例
  test_ratio: 0.3

  # 滾動窗口設定
  rolling_window:
    train_window: 252  # 一年
    test_window: 63    # 一季
    step: 21           # 一個月

  # 蒙地卡羅設定
  monte_carlo:
    n_simulations: 10000
    confidence_level: 0.95

# =============================================================================
# 風險管理
# =============================================================================
risk:
  # 無風險利率 (用於計算 Sharpe Ratio)
  risk_free_rate: 0.02  # 2%

  # 最大可接受回撤
  max_drawdown_limit: 0.20  # 20%

  # VaR 信心水準
  var_confidence: 0.95

# =============================================================================
# 資料設定
# =============================================================================
data:
  # 快取過期時間 (小時)
  cache_expiry_hours: 24

  # 預設股票清單
  default_symbols:
    - "0050.TW"  # 元大台灣50
    - "0056.TW"  # 元大高股息
    - "00878.TW" # 國泰永續高股息

  # 基準指數
  benchmark: "^TWII"  # 加權指數

# =============================================================================
# Streamlit UI 設定
# =============================================================================
ui:
  # 頁面標題
  page_title: "Smart Pilot - 投資組合再平衡系統"

  # 圖表主題
  chart_theme: "light"  # light 或 dark

  # 預設顯示期間
  default_display_period: "1y"
